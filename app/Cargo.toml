[package]
name = "omatro"
version = "0.5.1"
edition = "2024"
description = "Balatro-like card game for Omarchy, in Qt Quick"
license = "MIT"

[dependencies]
omatro-engine = { path = "../engine" }
cxx = "1"
serde_json = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.10"
